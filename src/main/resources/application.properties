spring.application.name=tienda-neon

# Lee las credenciales desde el archivo .env (si existe) o desde variables de entorno.
# El archivo .env NO se sube a GitHub (está en .gitignore).
spring.config.import=optional:file:.env[.properties]

# --- Conexión a Neon (PostgreSQL en la nube) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# El plan gratuito de Neon limita conexiones: un pool chico basta.
spring.datasource.hikari.maximum-pool-size=5

# --- JPA / Hibernate ---
# update: crea/actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Servidor y CORS ---
server.port=${PORT:8080}
# Orígenes del frontend que pueden llamar a la API (separados por coma).
# 5173 = Vite (React) · 3000 = Create React App · 4200 = Angular
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
